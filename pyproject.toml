[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamepulse-analytics"
version = "2.0.0"
description = "Mobile game & consumer app product analytics engine: SQL cohort retention, LTV/ROAS payback modeling, funnel diagnostics, and statistical A/B experimentation with FastAPI."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Muhammed Buğra Çiftçi"}
]

[tool.setuptools.packages.find]
where = ["src"]
